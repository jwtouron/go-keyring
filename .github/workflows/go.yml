name: Go
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            nodearch: x64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            nodearch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            nodearch: x64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            nodearch: arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
            nodearch: x64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            nodearch: arm64
    env:
      KEYRING_OS_TEST: '1'
      CGO_ENABLED: ${{ matrix.goos == 'windows' && matrix.goarch == 'arm64' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.nodearch }}
      - name: Install Linux credential store
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring
      - name: Configure Windows x64 race compiler
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $compiler = (Get-Command gcc -ErrorAction Stop).Source
          $target = & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target.Trim() -ne 'x86_64-w64-mingw32') { throw 'Native MinGW-w64 required.' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify formatting, tests, and vet
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          race=(-race)
          if [[ "${{ matrix.goos }}/${{ matrix.goarch }}" == 'windows/arm64' ]]; then race=(); fi
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            dbus-run-session -- bash -euo pipefail -c '
              printf "%s" "synthetic-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
              go test -race -timeout=3m ./...
            '
          else
            go test "${race[@]}" -timeout=3m ./...
          fi
          go vet ./...
          git diff --exit-code
